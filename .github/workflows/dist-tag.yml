name: Set npm dist-tag

# Moves an npm dist-tag for @kaleidorg/wallet-engine to an ALREADY-PUBLISHED
# version. Separate from publish.yml because it is not a publish: npm refuses to
# republish an existing version, so `npm publish --tag` cannot move a tag after
# the fact and the only route is `npm dist-tag add`.
#
# This exists because `latest` drifts. It sat on 1.0.0-beta.4 for months, then
# on beta.63 while `beta` moved on — and every fix needed someone with npm
# credentials at a keyboard, which is why it kept not happening. The token is
# already in this repo for publish.yml; this makes using it a dispatch.
#
# `latest` is what a bare `npm install` resolves to. This package has no stable
# release yet, so `latest` legitimately points at a prerelease — but it should
# point at the CURRENT one.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published version to point at (e.g. 1.0.0-beta.68)'
        required: true
      tag:
        description: 'dist-tag to move'
        required: true
        default: latest

concurrency:
  group: npm-dist-tag
  cancel-in-progress: false

jobs:
  set-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      # Fail here rather than half-way through `dist-tag add`: a typo'd version
      # produces a clearer error than npm's, and a tag is never moved to
      # something that does not exist.
      - name: Verify the version is published
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! npm view "@kaleidorg/wallet-engine@$VERSION" version >/dev/null 2>&1; then
            echo "::error::@kaleidorg/wallet-engine@$VERSION is not published"
            exit 1
          fi
          echo "Found @kaleidorg/wallet-engine@$VERSION"

      - name: Move the dist-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          echo "Before:"; npm view @kaleidorg/wallet-engine dist-tags --json
          npm dist-tag add "@kaleidorg/wallet-engine@$VERSION" "$TAG"
          echo "After:"; npm view @kaleidorg/wallet-engine dist-tags --json
