name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type-check + build (tsc)
        run: pnpm run build

      - name: Test
        run: pnpm test

      # The tour is the front door for anyone evaluating the engine, and it
      # drives the real router and manifest rather than a transcript. Running it
      # here means a change to those internals cannot quietly break the first
      # thing a new developer executes. No node, credentials or network needed.
      - name: Example tour runs
        run: pnpm run example:tour

      # Audit only the engine's own runtime deps (@scure/*). The heavy protocol
      # SDKs are OPTIONAL and host-owned, so their transitive advisories are out
      # of scope here and must not break this repo's CI.
      - name: Audit production dependencies (high+)
        run: pnpm audit --prod --no-optional --audit-level=high
