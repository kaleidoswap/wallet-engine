name: Integration

# Live integration suite (test/integration/**): connects real WDK adapters to
# real test networks with the pre-funded Alice & Bob wallets (repo secrets).
#
# Trigger model: this suite exists to catch wire-contract drift, which happens
# when adapter code (or a dep) changes — so it runs on PRs / pushes that touch
# the relevant paths, plus manual dispatch. No nightly cron: a blind nightly
# mostly flakes and drains the send-test wallets with no code change behind it.
#
# Send tests move real (test-network) funds and run by DEFAULT here (nothing is
# skipped); the manual dispatch can turn them off for a quick read-only check.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/integration/**'
      - 'package.json'
      - 'package-lock.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/integration.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'test/integration/**'
      - 'package.json'
      - 'package-lock.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/integration.yml'
  workflow_dispatch:
    inputs:
      run_send_tests:
        description: 'Run fund-moving send/transfer tests'
        type: boolean
        default: true
      require_funded:
        description: 'Fail (not skip) when a wallet is too empty to send'
        type: boolean
        default: false
      require_endpoints:
        description: 'Fail (not skip) when a test network is unreachable'
        type: boolean
        default: false

concurrency:
  # The suites are stateful per wallet (rgb-lib data dirs, wallet balances) —
  # never run two instances against Alice & Bob at once.
  group: integration-alice-bob
  cancel-in-progress: false

jobs:
  integration:
    name: Live integration (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Node 22, NOT 24: @utexo/rgb-lib's SWIG bindings use v8 APIs removed in
      # Node 24 (FunctionCallbackInfo::Holder) and fail to compile there.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm, not pnpm: pnpm leaves rgb-lib unhoisted, so its rebuild produces no
      # .node artifact. `ci`, not `install`, reproduces the shipped dependency tree.
      - run: npm ci --ignore-scripts --no-audit --no-fund

      # Only the RGB-L1 native bindings need lifecycle scripts (node-gyp build
      # against the prebuilt librgblibcffi). Rebuild that one package instead
      # of installing the whole tree with scripts enabled.
      - name: Build rgb-lib native bindings
        run: npm rebuild @utexo/rgb-lib-linux-x64

      - name: Run integration suite
        env:
          ALICE_MNEMONIC: ${{ secrets.ALICE_MNEMONIC }}
          BOB_MNEMONIC: ${{ secrets.BOB_MNEMONIC }}
          # Send tests run by default (push/PR); a dispatch can opt out via the input.
          RUN_SEND_TESTS: ${{ github.event_name != 'workflow_dispatch' && '1' || (inputs.run_send_tests && '1' || '') }}
          # An empty wallet SKIPS its send test here rather than failing the job.
          # These wallets drain by design, and a drained one is not a regression
          # — but failing on it left this check red on `main` and on every PR
          # touching `src/**` for three days (#77), which is the same as having
          # no check. Dispatch with `require_funded` when the funding level is
          # the thing being tested.
          REQUIRE_FUNDED_WALLETS: ${{ (github.event_name == 'workflow_dispatch' && inputs.require_funded) && '1' || '' }}
          # An unreachable test network SKIPS its suite rather than failing the
          # job, for the same reason: mutinynet, liquidtestnet and the regtest
          # server going down is not a regression in this repo, and a job that
          # cannot tell the two apart stops being read at all.
          REQUIRE_LIVE_ENDPOINTS: ${{ (github.event_name == 'workflow_dispatch' && inputs.require_endpoints) && '1' || '' }}
        run: npm run test:integration
